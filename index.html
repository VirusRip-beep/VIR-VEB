<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VIRUS CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #020305;
            --panel: #080b10;
            --gold: #e9aa27;
            --gold-light: #ffd85a;
            --purple: #8b3cff;
            --muted: #69717c;
            --red: #ff3b30;
            --green: #34c759;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { width: 100%; min-height: 100%; background: #000; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #fff;
            background: radial-gradient(circle at 50% 10%, rgba(25,35,55,.30), transparent 43%), #020305;
            overflow-x: hidden;
            padding-top: max(8px, env(safe-area-inset-top));
            padding-left: 8px; padding-right: 8px;
            padding-bottom: calc(82px + env(safe-area-inset-bottom));
        }

        /* HEADER */
        .header {
            width: 100%; height: 72px; min-height: 72px;
            display: grid; grid-template-columns: 1fr auto 1fr;
            align-items: center; margin-bottom: 9px; position: relative;
        }
        .header-left { display: flex; align-items: center; gap: 8px; justify-self: start; }
        .back-btn {
            display: none; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer;
        }
        .user-box {
            display: flex; align-items: center; gap: 7px; min-width: 0; height: 45px;
            padding: 4px 9px 4px 4px; background: linear-gradient(145deg, rgba(20,24,31,.97), rgba(5,7,11,.97));
            border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
        }
        .avatar {
            width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            overflow: hidden; border-radius: 8px; background: radial-gradient(circle, #214d24 0%, #0a180d 65%, #050707 100%);
            border: 1px solid rgba(255,255,255,.13); color: #65e36d; font-size: 21px; font-weight: 900;
        }
        .user-info { min-width: 0; }
        .user-name { max-width: 82px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 900; }
        .logo { text-align: center; line-height: 1; }
        .logo-title {
            font-family: Georgia, serif; font-size: clamp(23px, 6vw, 34px); font-weight: 900;
            background: linear-gradient(180deg, #fff0a1 0%, #f7c945 35%, #b36d0a 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .logo-subtitle { font-size: 8px; font-weight: 800; letter-spacing: 3px; color: #a6a9ae; }
        .balance-box {
            justify-self: end; display: flex; align-items: center; gap: 8px; height: 45px; min-width: 90px;
            padding: 5px 7px; background: linear-gradient(145deg, rgba(21,17,8,.98), rgba(8,8,7,.98));
            border: 1px solid rgba(212,159,48,.35); border-radius: 9px; cursor: pointer;
        }
        .balance-info { text-align: left; line-height: 1.05; }
        .balance { font-size: 12px; font-weight: 900; white-space: nowrap; }
        .currency { margin-top: 3px; font-size: 8px; font-weight: 800; color: #b9a05d; }
        .plus { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(135,66,255,.65); color: #a45cff; font-size: 18px; }

        /* PAGES & GAMES */
        .page { display: none; animation: pageIn .18s ease; }
        .page.active { display: block; }
        @keyframes pageIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .games-grid { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .game-card { position: relative; width: 100%; aspect-ratio: 1.16 / 1; overflow: hidden; border-radius: 9px; background: #05070a; border: 1px solid rgba(255,255,255,.14); cursor: pointer; }
        .game-card img { width: 100%; height: 100%; object-fit: cover; }

        .content-box { margin: 5px 2px; padding: 15px; background: linear-gradient(145deg, rgba(14,18,25,.96), rgba(5,7,11,.96)); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; }
        .game-title { text-align: center; color: var(--gold); font-size: 20px; font-weight: 900; margin-bottom: 12px; text-transform: uppercase; }

        /* INPUTS & CONTROLS */
        .controls-form { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; color: var(--muted); font-weight: 700; }
        .custom-input {
            width: 100%; height: 42px; background: #080b10; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; color: #fff; padding: 0 12px; font-weight: 800; font-size: 14px; outline: none;
        }
        .custom-input.error { border-color: var(--red); color: var(--red); }
        .btn-action {
            width: 100%; height: 46px; background: linear-gradient(180deg, #ffd85a 0%, #e9aa27 100%);
            border: none; border-radius: 9px; color: #000; font-weight: 900; font-size: 15px; cursor: pointer; text-transform: uppercase;
        }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
        .history-bar { display: flex; gap: 6px; justify-content: center; margin-top: 10px; min-height: 24px; flex-wrap: wrap; }
        .history-chip { padding: 3px 8px; border-radius: 5px; font-size: 10px; font-weight: 900; background: #141923; border: 1px solid rgba(255,255,255,0.1); }
        .history-chip.win { color: var(--green); border-color: var(--green); }
        .history-chip.loss { color: var(--red); border-color: var(--red); }

        /* GAME SPECIFIC CONTAINERS */
        /* PLINKO */
        #plinko-board { width: 100%; height: 260px; background: #030508; border-radius: 8px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .plinko-peg { position: absolute; width: 6px; height: 6px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 4px #fff; }
        .plinko-ball { position: absolute; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; }
        .plinko-slots { position: absolute; bottom: 0; left: 0; right: 0; height: 26px; display: flex; gap: 2px; padding: 0 5px; }
        .plinko-slot { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 900; border-radius: 4px 4px 0 0; color: #000; }

        /* SLOTS */
        .slots-wrapper { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .slot-reel { width: 70px; height: 80px; background: #080b10; border: 2px solid var(--gold); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; overflow: hidden; }
        .popup-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 2px solid var(--gold); padding: 20px 40px; border-radius: 15px; font-size: 22px; font-weight: 900; color: var(--gold); z-index: 999; display: none; text-align: center; }

        /* WHEEL */
        .wheel-container { position: relative; width: 220px; height: 220px; margin: 10px auto; }
        #wheel-canvas { width: 100%; height: 100%; border-radius: 50%; }
        .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 18px solid var(--gold); z-index: 10; }

        /* MINES */
        .mines-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0; }
        .mine-cell { aspect-ratio: 1; background: #0d121c; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; font-weight: 900; }
        .mine-cell.open-safe { background: rgba(52, 199, 89, 0.2); border-color: var(--green); color: var(--green); }
        .mine-cell.open-bomb { background: rgba(255, 59, 48, 0.2); border-color: var(--red); }
        .mines-multiplier { text-align: center; font-size: 14px; font-weight: 900; color: var(--gold); margin: 5px 0; }

        /* COIN */
        .coin-wrapper { width: 100px; height: 100px; margin: 20px auto; perspective: 1000px; }
        .coin { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .coin-side { position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 36px; border: 4px solid var(--gold); background: #141923; }
        .coin-tails { transform: rotateY(180deg); }
        .coin-selector { display: flex; gap: 10px; margin-bottom: 10px; }
        .coin-btn { flex: 1; height: 36px; background: #080b10; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; font-weight: 800; cursor: pointer; }
        .coin-btn.active { border-color: var(--gold); color: var(--gold); }

        /* CRASH */
        .crash-area { width: 100%; height: 200px; background: #030508; border-radius: 8px; position: relative; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        #crash-canvas { width: 100%; height: 100%; }
        .crash-mult { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 36px; font-weight: 900; color: #fff; }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
            height: calc(74px + env(safe-area-inset-bottom)); padding: 5px 7px env(safe-area-inset-bottom);
            display: flex; align-items: flex-start; justify-content: space-around;
            background: linear-gradient(180deg, rgba(3,5,8,.88), rgba(1,2,4,.99));
            border-top: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(16px);
        }
        .nav-item { width: 20%; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #626a75; font-size: 8px; font-weight: 700; cursor: pointer; }
        .nav-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .nav-icon svg { width: 25px; height: 25px; stroke: currentColor; }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <button class="back-btn" id="back-btn" onclick="goToLobby()">◄ НАЗАД</button>
            <div class="user-box" id="user-box-container">
                <div class="avatar" id="user-avatar">☣</div>
                <div class="user-info">
                    <div class="user-name" id="user-name">NONE</div>
                </div>
            </div>
        </div>
        <div class="logo">
            <div class="logo-title">VIRUS</div>
            <div class="logo-subtitle">CASINO</div>
        </div>
        <div class="balance-box" onclick="addBalance()">
            <div class="balance-info">
                <div class="balance" id="bal">120 000</div>
                <div class="currency">VIR</div>
            </div>
            <div class="plus">+</div>
        </div>
    </header>

    <!-- POPUP MODAL -->
    <div class="popup-modal" id="popup-modal">ВЫИГРЫШ!</div>

    <!-- MAIN LOBBY -->
    <main id="page-lobby" class="page active">
        <div class="games-grid">
            <div class="game-card" onclick="openGame('plinko')"><img src="https://i.ibb.co/JjLVCZ0w/1786809225235.jpg" alt="Plinko"></div>
            <div class="game-card" onclick="openGame('slots')"><img src="https://i.ibb.co/8DHFnhZ6/1786809778900.jpg" alt="Slots"></div>
            <div class="game-card" onclick="openGame('wheel')"><img src="https://i.ibb.co/0j4rs2WB/1786809906957.jpg" alt="Wheel"></div>
            <div class="game-card" onclick="openGame('mines')"><img src="https://i.ibb.co/NR96zJH/1786810227620.jpg" alt="Mines"></div>
            <div class="game-card" onclick="openGame('coin')"><img src="https://i.ibb.co/0jz38B2x/1786812059917.jpg" alt="Coin"></div>
            <div class="game-card" onclick="openGame('crash')"><img src="https://i.ibb.co/4ncgxRD2/1786810602933.jpg" alt="Crash"></div>
        </div>
    </main>

    <!-- PLINKO PAGE -->
    <section id="game-plinko" class="page">
        <div class="content-box">
            <div class="game-title">PLINKO</div>
            <div id="plinko-board">
                <div class="plinko-slots" id="plinko-slots"></div>
            </div>
            <div class="history-bar" id="plinko-history"></div>
            <div class="controls-form">
                <div class="input-group">
                    <label>СТАВКА (МИН. 150 VIR):</label>
                    <input type="number" id="plinko-bet" class="custom-input" value="150" oninput="validateInput(this, 150)">
                </div>
                <div class="input-group">
                    <label>КОЛ-ВО ШАРИКОВ (2 - 10):</label>
                    <input type="number" id="plinko-balls" class="custom-input" value="2" oninput="validateInputRange(this, 2, 10)">
                </div>
                <button class="btn-action" id="plinko-start" onclick="startPlinko()">НАЧАТЬ</button>
            </div>
        </div>
    </section>

    <!-- SLOTS PAGE -->
    <section id="game-slots" class="page">
        <div class="content-box">
            <div class="game-title">SLOTS</div>
            <div class="slots-wrapper">
                <div class="slot-reel" id="reel-1">🎰</div>
                <div class="slot-reel" id="reel-2">🎰</div>
                <div class="slot-reel" id="reel-3">🎰</div>
            </div>
            <div class="controls-form">
                <div class="input-group">
                    <label>СТАВКА (МИН. 200 VIR):</label>
                    <input type="number" id="slots-bet" class="custom-input" value="200" oninput="validateInput(this, 200)">
                </div>
                <button class="btn-action" id="slots-start" onclick="startSlots()">КРУТИТЬ</button>
            </div>
        </div>
    </section>

    <!-- WHEEL PAGE -->
    <section id="game-wheel" class="page">
        <div class="content-box">
            <div class="game-title">WHEEL OF FORTUNE</div>
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <canvas id="wheel-canvas" width="220" height="220"></canvas>
            </div>
            <div class="history-bar" id="wheel-history"></div>
            <div class="controls-form">
                <div class="input-group">
                    <label>СТАВКА (МИН. 1000 VIR):</label>
                    <input type="number" id="wheel-bet" class="custom-input" value="1000" oninput="validateInput(this, 1000)">
                </div>
                <button class="btn-action" id="wheel-start" onclick="startWheel()">КРУТИТЬ</button>
            </div>
        </div>
    </section>

    <!-- MINES PAGE -->
    <section id="game-mines" class="page">
        <div class="content-box">
            <div class="game-title">MINES</div>
            <div class="mines-multiplier" id="mines-mult-text">МНОЖИТЕЛЬ: x1.00</div>
            <div class="mines-grid" id="mines-grid"></div>
            <div class="controls-form">
                <div class="input-group" id="mines-bet-group">
                    <label>СТАВКА (МИН. 150 VIR):</label>
                    <input type="number" id="mines-bet" class="custom-input" value="150" oninput="validateInput(this, 150)">
                </div>
                <div class="input-group" id="mines-count-group">
                    <label>КОЛ-ВО МИН (3 - 7):</label>
                    <input type="number" id="mines-count" class="custom-input" value="3" oninput="validateInputRange(this, 3, 7)">
                </div>
                <button class="btn-action" id="mines-action-btn" onclick="handleMinesAction()">СТАРТ</button>
            </div>
        </div>
    </section>

    <!-- COIN PAGE -->
    <section id="game-coin" class="page">
        <div class="content-box">
            <div class="game-title">COIN FLIP</div>
            <div class="coin-wrapper">
                <div class="coin" id="coin-element">
                    <div class="coin-side coin-heads">🦅</div>
                    <div class="coin-side coin-tails">🪙</div>
                </div>
            </div>
            <div class="history-bar" id="coin-history"></div>
            <div class="controls-form">
                <div class="coin-selector">
                    <button class="coin-btn active" id="coin-btn-heads" onclick="selectCoinSide('heads')">ОРЕЛ</button>
                    <button class="coin-btn" id="coin-btn-tails" onclick="selectCoinSide('tails')">РЕШКА</button>
                </div>
                <div class="input-group">
                    <label>СТАВКА (МИН. 150 VIR):</label>
                    <input type="number" id="coin-bet" class="custom-input" value="150" oninput="validateInput(this, 150)">
                </div>
                <button class="btn-action" id="coin-start" onclick="startCoin()">БРОСИТЬ</button>
            </div>
        </div>
    </section>

    <!-- CRASH PAGE -->
    <section id="game-crash" class="page">
        <div class="content-box">
            <div class="game-title">CRASH</div>
            <div class="crash-area">
                <canvas id="crash-canvas" width="300" height="200"></canvas>
                <div class="crash-mult" id="crash-mult">1.00x</div>
            </div>
            <div class="controls-form">
                <div class="input-group" id="crash-bet-group">
                    <label>СТАВКА (МИН. 150 VIR):</label>
                    <input type="number" id="crash-bet" class="custom-input" value="150" oninput="validateInput(this, 150)">
                </div>
                <div class="input-group" id="crash-auto-group">
                    <label>АВТО-СТОП (НЕОБЯЗАТЕЛЬНО, НАПР. 2.5):</label>
                    <input type="number" step="0.1" id="crash-auto" class="custom-input" placeholder="Не задано">
                </div>
                <button class="btn-action" id="crash-action-btn" onclick="handleCrashAction()">СТАРТ</button>
            </div>
        </div>
    </section>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="showPage('page-lobby', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10v5"/><path d="M5.5 12.5h5"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="14" r="1"/></svg></div>
            <span class="nav-label">Игры</span>
        </div>
    </nav>

    <script>
        /* TELEGRAM & BALANCE SYSTEM */
        const tg = window.Telegram?.WebApp;
        let balance = 120000;

        function formatBalance(val) {
            val = Number(val) || 0;
            if (val >= 1000000) {
                return (val / 1000000).toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1") + "кк";
            }
            return Math.floor(val).toLocaleString("ru-RU").replace(/\u00A0/g, " ");
        }

        function updateBalanceUI() {
            document.getElementById("bal").textContent = formatBalance(balance);
        }

        if (tg) {
            tg.ready();
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById("user-name").textContent = user.first_name || user.username || "PLAYER";
                if (user.photo_url) {
                    const av = document.getElementById("user-avatar");
                    av.innerHTML = "";
                    av.style.backgroundImage = `url("${user.photo_url}")`;
                }
            }
        }

        /* NAVIGATION CONTROL */
        function goToLobby() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-lobby').classList.add('active');
            document.getElementById('back-btn').style.display = 'none';
            document.getElementById('user-box-container').style.display = 'flex';
        }

        function showPage(pageId, navEl) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if (navEl) {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                navEl.classList.add('active');
            }
            document.getElementById('back-btn').style.display = (pageId === 'page-lobby') ? 'none' : 'block';
            document.getElementById('user-box-container').style.display = (pageId === 'page-lobby') ? 'flex' : 'none';
        }

        function openGame(gameName) {
            showPage(`game-${gameName}`);
            if (gameName === 'wheel') initWheelCanvas();
            if (gameName === 'mines') resetMinesUI();
            if (gameName === 'crash') resetCrashUI();
        }

        function showPopup(text) {
            const popup = document.getElementById("popup-modal");
            popup.textContent = text;
            popup.style.display = "block";
            setTimeout(() => { popup.style.display = "none"; }, 1300);
        }

        /* VALIDATORS */
        function validateInput(el, minVal) {
            const val = parseFloat(el.value);
            if (isNaN(val) || val < minVal) {
                el.classList.add("error");
                return false;
            } else {
                el.classList.remove("error");
                return true;
            }
        }

        function validateInputRange(el, minVal, maxVal) {
            const val = parseFloat(el.value);
            if (isNaN(val) || val < minVal || val > maxVal) {
                el.classList.add("error");
                return false;
            } else {
                el.classList.remove("error");
                return true;
            }
        }

        /* ==================== 1. PLINKO ==================== */
        const plinkoMultipliers = [15, 5, 2, 0.5, 0.2, 0.5, 2, 5, 15];
        const plinkoColors = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#5856d6', '#34c759', '#ffcc00', '#ff9500', '#ff3b30'];

        function initPlinkoSlots() {
            const container = document.getElementById('plinko-slots');
            container.innerHTML = '';
            plinkoMultipliers.forEach((m, idx) => {
                const slot = document.createElement('div');
                slot.className = 'plinko-slot';
                slot.style.background = plinkoColors[idx];
                slot.textContent = 'x' + m;
                container.appendChild(slot);
            });
        }
        initPlinkoSlots();

        function startPlinko() {
            const betEl = document.getElementById('plinko-bet');
            const ballsEl = document.getElementById('plinko-balls');
            if (!validateInput(betEl, 150) || !validateInputRange(ballsEl, 2, 10)) return;

            const totalBet = parseFloat(betEl.value);
            const ballsCount = parseInt(ballsEl.value);
            if (balance < totalBet) return alert("Недостаточно баланса!");

            balance -= totalBet;
            updateBalanceUI();

            const singleBet = totalBet / ballsCount;
            const btn = document.getElementById('plinko-start');
            btn.disabled = true;

            let finished = 0;
            for (let i = 0; i < ballsCount; i++) {
                setTimeout(() => {
                    dropPlinkoBall(singleBet, () => {
                        finished++;
                        if (finished === ballsCount) btn.disabled = false;
                    });
                }, i * 300);
            }
        }

        function dropPlinkoBall(singleBet, onComplete) {
            const board = document.getElementById('plinko-board');
            const ball = document.createElement('div');
            ball.className = 'plinko-ball';
            ball.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
            board.appendChild(ball);

            // Weighted random targeting center
            const weights = [1, 3, 10, 25, 45, 25, 10, 3, 1];
            const totalW = weights.reduce((a,b)=>a+b, 0);
            let rnd = Math.random() * totalW;
            let targetSlot = 0;
            for(let i=0; i<weights.length; i++){
                if(rnd < weights[i]) { targetSlot = i; break; }
                rnd -= weights[i];
            }

            let posX = 50;
            let posY = 10;
            ball.style.left = posX + '%';
            ball.style.top = posY + 'px';

            let step = 0;
            const targetX = 5.5 + targetSlot * 11;
            const interval = setInterval(() => {
                step++;
                posY += 12;
                posX += (targetX - posX) * 0.15;
                ball.style.top = posY + 'px';
                ball.style.left = posX + '%';

                if (posY >= 235) {
                    clearInterval(interval);
                    board.removeChild(ball);

                    const mult = plinkoMultipliers[targetSlot];
                    const win = singleBet * mult;
                    balance += win;
                    updateBalanceUI();

                    const hist = document.getElementById('plinko-history');
                    const chip = document.createElement('div');
                    chip.className = `history-chip ${win >= singleBet ? 'win' : 'loss'}`;
                    chip.textContent = `x${mult}`;
                    hist.prepend(chip);
                    if(hist.children.length > 5) hist.removeChild(hist.lastChild);

                    onComplete();
                }
            }, 30);
        }

        /* ==================== 2. SLOTS ==================== */
        const slotSymbols = ['🍇', '🍒', '🍋', '7️⃣'];

        function startSlots() {
            const betEl = document.getElementById('slots-bet');
            if (!validateInput(betEl, 200)) return;
            const bet = parseFloat(betEl.value);
            if (balance < bet) return alert("Недостаточно баланса!");

            balance -= bet;
            updateBalanceUI();

            const btn = document.getElementById('slots-start');
            btn.disabled = true;

            const r1 = document.getElementById('reel-1');
            const r2 = document.getElementById('reel-2');
            const r3 = document.getElementById('reel-3');

            let timer = setInterval(() => {
                r1.textContent = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
                r2.textContent = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
                r3.textContent = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
            }, 50);

            setTimeout(() => {
                clearInterval(timer);
                btn.disabled = false;

                // Weighted Outcome
                const rnd = Math.random();
                let res1, res2, res3;
                if(rnd < 0.05) { res1 = res2 = res3 = '7️⃣'; } // 5% Triple 7
                else if(rnd < 0.20) { res1 = res2 = res3 = '🍒'; } // 15% Triple Cherry
                else if(rnd < 0.40) { res1 = res2 = '7️⃣'; res3 = '🍋'; } // Two 7s
                else {
                    res1 = slotSymbols[Math.floor(Math.random()*4)];
                    res2 = slotSymbols[Math.floor(Math.random()*4)];
                    res3 = slotSymbols[Math.floor(Math.random()*4)];
                }

                r1.textContent = res1; r2.textContent = res2; r3.textContent = res3;

                let winMult = 0;
                if(res1 === res2 && res2 === res3) {
                    winMult = (res1 === '7️⃣') ? 10 : 4;
                } else if(res1 === res2 || res2 === res3) {
                    winMult = 1.5;
                }

                if(winMult > 0) {
                    const win = bet * winMult;
                    balance += win;
                    updateBalanceUI();
                    showPopup(`ВЫИГРЫШ +${formatBalance(win)} VIR!`);
                }
            }, 2300);
        }

        /* ==================== 3. WHEEL ==================== */
        const wheelSectors = [
            { mult: 0, color: '#ff3b30' },
            { mult: 0.5, color: '#ff9500' },
            { mult: 1.2, color: '#ffcc00' },
            { mult: 2, color: '#34c759' },
            { mult: 7.5, color: '#5856d6' },
            { mult: 15, color: '#e9aa27' }
        ];
        let wheelAngle = 0;

        function initWheelCanvas() {
            const canvas = document.getElementById('wheel-canvas');
            const ctx = canvas.getContext('2d');
            const arc = (Math.PI * 2) / wheelSectors.length;

            ctx.clearRect(0,0,220,220);
            wheelSectors.forEach((sec, i) => {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = sec.color;
                ctx.moveTo(110, 110);
                ctx.arc(110, 110, 100, angle, angle + arc);
                ctx.lineTo(110, 110);
                ctx.fill();

                ctx.save();
                ctx.fillStyle = "#fff";
                ctx.font = "bold 12px sans-serif";
                ctx.translate(110 + Math.cos(angle + arc/2) * 70, 110 + Math.sin(angle + arc/2) * 70);
                ctx.fillText('x' + sec.mult, -10, 4);
                ctx.restore();
            });
        }

        function startWheel() {
            const betEl = document.getElementById('wheel-bet');
            if (!validateInput(betEl, 1000)) return;
            const bet = parseFloat(betEl.value);
            if (balance < bet) return alert("Недостаточно баланса!");

            balance -= bet;
            updateBalanceUI();

            const btn = document.getElementById('wheel-start');
            btn.disabled = true;

            const rnd = Math.random();
            let sectorIndex = 0; // x0 High chance
            if(rnd < 0.40) sectorIndex = 0;
            else if(rnd < 0.70) sectorIndex = 1;
            else if(rnd < 0.88) sectorIndex = 2;
            else if(rnd < 0.96) sectorIndex = 3;
            else if(rnd < 0.99) sectorIndex = 4;
            else sectorIndex = 5;

            const arc = (Math.PI * 2) / wheelSectors.length;
            const targetAngle = (Math.PI * 2 * 4) - (sectorIndex * arc) - (arc / 2) - (Math.PI / 2);
            
            const canvas = document.getElementById('wheel-canvas');
            canvas.style.transition = 'transform 3s cubic-bezier(0.15, 0.9, 0.2, 1)';
            canvas.style.transform = `rotate(${targetAngle}rad)`;

            setTimeout(() => {
                btn.disabled = false;
                const win = bet * wheelSectors[sectorIndex].mult;
                balance += win;
                updateBalanceUI();

                const hist = document.getElementById('wheel-history');
                const chip = document.createElement('div');
                chip.className = `history-chip ${win >= bet ? 'win' : 'loss'}`;
                chip.textContent = `x${wheelSectors[sectorIndex].mult}`;
                hist.prepend(chip);
                if(hist.children.length > 3) hist.removeChild(hist.lastChild);
            }, 3000);
        }

        /* ==================== 4. MINES ==================== */
        let minesActive = false;
        let minesArray = [];
        let openedSafeCount = 0;
        let currentMinesBet = 0;
        let currentMinesMult = 1.0;

        function resetMinesUI() {
            minesActive = false;
            document.getElementById('mines-bet-group').style.display = 'flex';
            document.getElementById('mines-count-group').style.display = 'flex';
            document.getElementById('mines-action-btn').textContent = 'СТАРТ';
            document.getElementById('mines-mult-text').textContent = 'МНОЖИТЕЛЬ: x1.00';
            const grid = document.getElementById('mines-grid');
            grid.innerHTML = '';
            for(let i=0; i<42; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.textContent = '?';
                grid.appendChild(cell);
            }
        }

        function handleMinesAction() {
            if (!minesActive) {
                const betEl = document.getElementById('mines-bet');
                const countEl = document.getElementById('mines-count');
                if (!validateInput(betEl, 150) || !validateInputRange(countEl, 3, 7)) return;

                currentMinesBet = parseFloat(betEl.value);
                const minesCount = parseInt(countEl.value);
                if (balance < currentMinesBet) return alert("Недостаточно баланса!");

                balance -= currentMinesBet;
                updateBalanceUI();

                minesActive = true;
                openedSafeCount = 0;
                currentMinesMult = 1.0;

                // Setup Board
                minesArray = Array(42).fill(false);
                let placed = 0;
                while(placed < minesCount) {
                    let idx = Math.floor(Math.random() * 42);
                    if(!minesArray[idx]) { minesArray[idx] = true; placed++; }
                }

                document.getElementById('mines-bet-group').style.display = 'none';
                document.getElementById('mines-count-group').style.display = 'none';
                document.getElementById('mines-action-btn').textContent = 'ЗАБРАТЬ';

                const grid = document.getElementById('mines-grid');
                grid.innerHTML = '';
                for(let i=0; i<42; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'mine-cell';
                    cell.textContent = '';
                    cell.onclick = () => clickMineCell(i, cell);
                    grid.appendChild(cell);
                }
            } else {
                // Cashout
                const win = currentMinesBet * currentMinesMult;
                balance += win;
                updateBalanceUI();
                showPopup(`ЗАБРАНО +${formatBalance(win)} VIR!`);
                resetMinesUI();
            }
        }

        function clickMineCell(idx, cell) {
            if(!minesActive || cell.classList.contains('open-safe')) return;

            if(minesArray[idx]) {
                cell.classList.add('open-bomb');
                cell.textContent = '💣';
                alert("БУМ! Вы подорвались на мине!");
                resetMinesUI();
            } else {
                cell.classList.add('open-safe');
                cell.textContent = '💎';
                openedSafeCount++;
                currentMinesMult += 0.25;
                document.getElementById('mines-mult-text').textContent = `МНОЖИТЕЛЬ: x${currentMinesMult.toFixed(2)}`;
            }
        }

        /* ==================== 5. COIN ==================== */
        let selectedSide = 'heads';

        function selectCoinSide(side) {
            selectedSide = side;
            document.getElementById('coin-btn-heads').className = `coin-btn ${side==='heads'?'active':''}`;
            document.getElementById('coin-btn-tails').className = `coin-btn ${side==='tails'?'active':''}`;
        }

        function startCoin() {
            const betEl = document.getElementById('coin-bet');
            if (!validateInput(betEl, 150)) return;
            const bet = parseFloat(betEl.value);
            if (balance < bet) return alert("Недостаточно баланса!");

            balance -= bet;
            updateBalanceUI();

            const btn = document.getElementById('coin-start');
            btn.disabled = true;

            const coin = document.getElementById('coin-element');
            const isHeads = Math.random() < 0.5;
            const spins = 5 * 360;
            const finalDeg = isHeads ? spins : spins + 180;

            coin.style.transform = `rotateY(${finalDeg}deg)`;

            setTimeout(() => {
                btn.disabled = false;
                const wonSide = isHeads ? 'heads' : 'tails';
                const win = (selectedSide === wonSide) ? bet * 1.95 : 0;

                if (win > 0) {
                    balance += win;
                    updateBalanceUI();
                }

                const hist = document.getElementById('coin-history');
                const chip = document.createElement('div');
                chip.className = `history-chip ${win > 0 ? 'win' : 'loss'}`;
                chip.textContent = wonSide === 'heads' ? '🦅' : '🪙';
                hist.prepend(chip);
                if(hist.children.length > 3) hist.removeChild(hist.lastChild);

                coin.style.transition = 'none';
                coin.style.transform = isHeads ? 'rotateY(0deg)' : 'rotateY(180deg)';
                setTimeout(() => { coin.style.transition = 'transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; }, 50);
            }, 2000);
        }

        /* ==================== 6. CRASH ==================== */
        let crashActive = false;
        let crashMult = 1.0;
        let crashTimer = null;
        let crashCrashAt = 1.0;
        let currentCrashBet = 0;

        function resetCrashUI() {
            crashActive = false;
            clearInterval(crashTimer);
            document.getElementById('crash-bet-group').style.display = 'flex';
            document.getElementById('crash-auto-group').style.display = 'flex';
            document.getElementById('crash-action-btn').textContent = 'СТАРТ';
            document.getElementById('crash-mult').textContent = '1.00x';
            document.getElementById('crash-mult').style.color = '#fff';
        }

        function handleCrashAction() {
            if(!crashActive) {
                const betEl = document.getElementById('crash-bet');
                if(!validateInput(betEl, 150)) return;
                currentCrashBet = parseFloat(betEl.value);
                if(balance < currentCrashBet) return alert("Недостаточно баланса!");

                balance -= currentCrashBet;
                updateBalanceUI();

                crashActive = true;
                crashMult = 1.0;

                // Rigged Crash point
                const rnd = Math.random();
                if(rnd < 0.50) crashCrashAt = 1.1 + Math.random() * 0.8; // 50% blow below 1.9x
                else if(rnd < 0.85) crashCrashAt = 2.0 + Math.random() * 3.0; // 35% blow below 5.0x
                else crashCrashAt = 5.0 + Math.random() * 10.0; // 15% high multiplier

                document.getElementById('crash-bet-group').style.display = 'none';
                document.getElementById('crash-auto-group').style.display = 'none';
                document.getElementById('crash-action-btn').textContent = 'ЗАБРАТЬ ВЫИГРЫШ';

                const autoVal = parseFloat(document.getElementById('crash-auto').value);

                crashTimer = setInterval(() => {
                    crashMult += 0.03;
                    const multText = document.getElementById('crash-mult');
                    multText.textContent = crashMult.toFixed(2) + 'x';
                    if(crashMult >= 10.0) multText.style.color = 'var(--green)';

                    if(autoVal && crashMult >= autoVal) {
                        handleCrashAction(); // Auto Cashout
                        return;
                    }

                    if(crashMult >= crashCrashAt) {
                        clearInterval(crashTimer);
                        multText.textContent = 'CRASHED!';
                        multText.style.color = 'var(--red)';
                        setTimeout(resetCrashUI, 1500);
                    }
                }, 100);
            } else {
                // Cashout
                clearInterval(crashTimer);
                const win = currentCrashBet * crashMult;
                balance += win;
                updateBalanceUI();
                showPopup(`ЗАБРАНО +${formatBalance(win)} VIR!`);
                resetCrashUI();
            }
        }

        // Init UI Balance
        updateBalanceUI();
    </script>
</body>
</html>
