<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VIR CASINO</title>
    
    <!-- Matter.js для Plinko и Telegram WebApp SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- 🎨 ВСЕ СТИЛИ (CSS) -->
    <style>
        :root {
            --bg-color: #0f0f18;
            --card-bg: #1a1a28;
            --accent-color: #7b2cbf;
            --accent-hover: #9d4edd;
            --text-color: #ffffff;
            --text-dim: #9d9db5;
            --success: #2ec4b6;
            --danger: #e63946;
            --gold: #ffb703;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Хедер */
        header {
            background: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-name {
            font-weight: 600;
            font-size: 16px;
        }

        .balance-container {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-val {
            font-weight: 700;
            color: var(--gold);
        }

        /* Верхняя панель действий */
        .actions-bar {
            display: flex;
            gap: 10px;
            padding: 15px 20px 5px 20px;
        }

        /* Кнопки */
        .btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary { background: var(--accent-color); }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-block { width: 100%; }

        /* Навигация игр */
        .games-nav {
            display: flex;
            overflow-x: auto;
            padding: 15px 20px;
            gap: 10px;
            scrollbar-width: none;
        }
        .games-nav::-webkit-scrollbar { display: none; }

        .nav-tab {
            padding: 10px 18px;
            background: var(--card-bg);
            border-radius: 10px;
            white-space: nowrap;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .nav-tab.active {
            background: var(--accent-color);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Контейнеры игр */
        .main-container {
            flex: 1;
            padding: 0 20px 20px 20px;
        }

        .game-section {
            display: none;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .game-section.active { display: block; }

        .bet-control {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .bet-control label {
            font-size: 14px;
            color: var(--text-dim);
        }

        .bet-input-wrap {
            display: flex;
            gap: 8px;
        }

        .bet-input-wrap input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            outline: none;
        }

        /* Модалка промокода */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .promo-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            outline: none;
        }

        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="user-info">
            <span class="user-name" id="user-name">Игрок</span>
        </div>
        <div class="balance-container">
            <span>💎</span>
            <span class="balance-val" id="balance-val">0</span>
            <span>VIR</span>
        </div>
    </header>

    <!-- Панель с Бонусом и Промокодом -->
    <div class="actions-bar">
        <button class="btn btn-secondary" style="flex: 1;" onclick="claimBonus()">🎁 Бонус</button>
        <button class="btn btn-secondary" style="flex: 1;" onclick="openPromoModal()">🎟 Промокод</button>
    </div>

    <!-- Навигация по играм -->
    <div class="games-nav">
        <div class="nav-tab active" onclick="switchGame('slots', event)">🎰 Слоты</div>
        <div class="nav-tab" onclick="switchGame('wheel', event)">🎡 Колесо</div>
        <div class="nav-tab" onclick="switchGame('coin', event)">🪙 Монетка</div>
        <div class="nav-tab" onclick="switchGame('plinko', event)">⚪ Plinko</div>
    </div>

    <!-- Основной блок игр -->
    <div class="main-container">
        
        <!-- Слоты -->
        <div id="game-slots" class="game-section active">
            <h2>🎰 Слоты</h2>
            <div style="font-size: 40px; margin: 30px 0;" id="slots-reels">❓ | ❓ | ❓</div>
            <div class="bet-control">
                <label>Ставка (VIR):</label>
                <div class="bet-input-wrap">
                    <input type="number" id="slots-bet" value="100" min="100">
                </div>
            </div>
            <button class="btn btn-primary btn-block" onclick="playSlots()">Крутить</button>
        </div>

        <!-- Колесо -->
        <div id="game-wheel" class="game-section">
            <h2>🎡 Колесо Фортуны</h2>
            <div style="margin: 20px auto; width: 180px; height: 180px; border-radius: 50%; border: 5px solid var(--accent-color); display: flex; align-items: center; justify-content: center; font-size: 40px;" id="wheel-target">
                🎯
            </div>
            <div class="bet-control">
                <label>Ставка (VIR):</label>
                <div class="bet-input-wrap">
                    <input type="number" id="wheel-bet" value="100" min="100">
                </div>
            </div>
            <button class="btn btn-primary btn-block" onclick="playWheel()">Вращать</button>
        </div>

        <!-- Монетка -->
        <div id="game-coin" class="game-section">
            <h2>🪙 Монетка</h2>
            <div style="font-size: 50px; margin: 20px 0;" id="coin-res">🪙</div>
            <div class="bet-control">
                <label>Ставка (VIR):</label>
                <div class="bet-input-wrap">
                    <input type="number" id="coin-bet" value="100" min="100">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" style="flex: 1;" onclick="playCoin('орёл')">Орёл</button>
                <button class="btn btn-primary" style="flex: 1;" onclick="playCoin('решка')">Решка</button>
            </div>
        </div>

        <!-- Plinko -->
        <div id="game-plinko" class="game-section">
            <h2>⚪ Plinko</h2>
            <div id="plinko-container" style="width: 100%; height: 260px; background: rgba(0,0,0,0.2); border-radius: 10px; margin: 15px 0;"></div>
            <div class="bet-control">
                <label>Ставка (VIR):</label>
                <div class="bet-input-wrap">
                    <input type="number" id="plinko-bet" value="100" min="100">
                </div>
            </div>
            <button class="btn btn-primary btn-block" onclick="playPlinko()">Бросить шар</button>
        </div>

    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОМОКОДА -->
    <div id="promo-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>🎟 Активация промокода</h3>
            <input type="text" id="promo-input" placeholder="ВВЕДИТЕ КОД" class="promo-input" autocomplete="off" />
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="submitPromocode()">Ввести</button>
                <button class="btn btn-secondary" onclick="closePromoModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ⚡ ВСЯ СКРИПТОВАЯ ЛОГИКА (JS) -->
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe?.user) {
                document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name || 'Игрок';
            }
        }

        // Запросы к бэкенду
        async function apiRequest(endpoint, bodyData = {}) {
            const initData = tg?.initData || '';
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData, ...bodyData })
                });
                return await response.json();
            } catch (err) {
                console.error(`Ошибка запроса:`, err);
                return { success: false, message: 'Ошибка связи с сервером' };
            }
        }

        function updateBalanceUI(newBalance) {
            document.getElementById('balance-val').innerText = newBalance;
        }

        function switchGame(gameId, event) {
            document.querySelectorAll('.game-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            
            const targetSection = document.getElementById(`game-${gameId}`);
            if (targetSection) targetSection.classList.add('active');
            if (event) event.currentTarget.classList.add('active');
        }

        // --- ПРОМОКОДЫ ---
        function openPromoModal() {
            document.getElementById('promo-modal').style.display = 'flex';
        }

        function closePromoModal() {
            document.getElementById('promo-modal').style.display = 'none';
            document.getElementById('promo-input').value = '';
        }

        async function submitPromocode() {
            const codeInput = document.getElementById('promo-input').value.trim();
            if (!codeInput) {
                alert('Пожалуйста, введите промокод!');
                return;
            }

            const res = await apiRequest('/api/promocode', { code: codeInput });
            alert(res.message);
            if (res.success) {
                updateBalanceUI(res.balance);
                closePromoModal();
            }
        }

        // --- БОНУС ---
        async function claimBonus() {
            const res = await apiRequest('/api/bonus');
            alert(res.message);
            if (res.success) {
                updateBalanceUI(res.balance);
            }
        }

        // --- ИГРЫ ---
        async function playSlots() {
            const bet = parseInt(document.getElementById('slots-bet').value);
            if (isNaN(bet) || bet < 100) return alert('Минимальная ставка: 100 VIR');

            const res = await apiRequest('/api/play', { game: 'slots', bet: bet });
            if (!res.success) return alert(res.message);

            if (res.reels) document.getElementById('slots-reels').innerText = res.reels.join(' | ');
            updateBalanceUI(res.balance);

            if (res.win > 0) alert(`🎉 Вы выиграли ${res.win} VIR!`);
        }

        async function playWheel() {
            const bet = parseInt(document.getElementById('wheel-bet').value);
            if (isNaN(bet) || bet < 100) return alert('Минимальная ставка: 100 VIR');

            const res = await apiRequest('/api/play', { game: 'wheel', bet: bet });
            if (!res.success) return alert(res.message);

            const wheelEl = document.getElementById('wheel-target');
            wheelEl.style.transition = 'transform 3s cubic-bezier(0.15, 0.9, 0.15, 1)';
            const deg = 360 * 5 + (res.targetAngle * 180 / Math.PI);
            wheelEl.style.transform = `rotate(${deg}deg)`;

            setTimeout(() => {
                updateBalanceUI(res.balance);
                if (res.win > 0) alert(`🎉 Коэффициент x${res.mult}! Выигрыш: ${res.win} VIR!`);
                else alert('😔 Не повезло!');
                wheelEl.style.transition = 'none';
                wheelEl.style.transform = 'rotate(0deg)';
            }, 3200);
        }

        async function playCoin(choice) {
            const bet = parseInt(document.getElementById('coin-bet').value);
            if (isNaN(bet) || bet < 100) return alert('Минимальная ставка: 100 VIR');

            const res = await apiRequest('/api/play', { game: 'coin', bet: bet, choice: choice });
            if (!res.success) return alert(res.message);

            document.getElementById('coin-res').innerText = res.result === 'орёл' ? '🦅 Орёл' : '🪙 Решка';
            updateBalanceUI(res.balance);

            if (res.win > 0) alert(`🎉 Вы угадали! +${res.win} VIR`);
            else alert(`😔 Выпало: ${res.result}`);
        }

        // --- PLINKO ---
        let plinkoEngine;
        function initPlinko() {
            const container = document.getElementById('plinko-container');
            if (!container || !window.Matter) return;

            const { Engine, Render, Runner, Bodies, Composite } = Matter;
            plinkoEngine = Engine.create();
            const render = Render.create({
                element: container,
                engine: plinkoEngine,
                options: { width: container.clientWidth || 280, height: 260, wireframes: false, background: 'transparent' }
            });

            for (let row = 2; row < 7; row++) {
                for (let col = 0; col <= row; col++) {
                    const x = (container.clientWidth / 2) + (col - row / 2) * 32;
                    const y = row * 32;
                    Composite.add(plinkoEngine.world, Bodies.circle(x, y, 4, { isStatic: true, render: { fillStyle: '#fff' } }));
                }
            }
            Composite.add(plinkoEngine.world, Bodies.rectangle(container.clientWidth / 2, 265, container.clientWidth, 10, { isStatic: true }));

            Render.run(render);
            Runner.run(Runner.create(), plinkoEngine);
        }

        async function playPlinko() {
            const bet = parseInt(document.getElementById('plinko-bet').value);
            if (isNaN(bet) || bet < 100) return alert('Минимальная ставка: 100 VIR');

            const mults = [0, 0.5, 1.5, 2, 5];
            const winMult = mults[Math.floor(Math.random() * mults.length)];
            const winAmt = Math.floor(bet * winMult);

            const res = await apiRequest('/api/play', { game: 'plinko', bet: bet, win: winAmt });
            if (!res.success) return alert(res.message);

            if (plinkoEngine) {
                const ball = Matter.Bodies.circle(140 + (Math.random() * 20 - 10), 10, 7, {
                    restitution: 0.5,
                    render: { fillStyle: '#ffb703' }
                });
                Matter.Composite.add(plinkoEngine.world, ball);
            }

            setTimeout(() => {
                updateBalanceUI(res.balance);
                if (winAmt > 0) alert(`🎉 Выигрыш: ${winAmt} VIR (x${winMult})!`);
            }, 1800);
        }

        // Старт данных при открытии
        async function loadUserInfo() {
            const res = await apiRequest('/api/user_info');
            if (res.success) updateBalanceUI(res.balance);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUserInfo();
            initPlinko();
        });
    </script>
</body>
</html>
