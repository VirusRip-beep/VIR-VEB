<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VIRUS CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: #020305;
            --text-gold: #ffcf40;
            --text-dim: #6c7a89;
            --accent: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, rgba(15, 25, 45, 0.5) 0%, transparent 70%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px 10px;
        }

        /* --- ШАПКА --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .user-block, .balance-block {
            background: rgba(12, 16, 24, 0.95);
            padding: 6px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-avatar { width: 32px; height: 32px; border-radius: 6px; background: #080c10; display: flex; align-items: center; justify-content: center; }
        .user-name { font-weight: 800; font-size: 11px; }
        .user-role { font-size: 9px; color: var(--text-dim); }

        .brand-logo { text-align: center; }
        .brand-title { font-size: 16px; font-weight: 900; letter-spacing: 1px; color: var(--text-gold); }
        .brand-subtitle { font-size: 7px; color: var(--text-dim); text-transform: uppercase; }

        .balance-val { font-weight: 800; font-size: 12px; }
        .balance-currency { font-size: 8px; color: var(--text-dim); }

        /* --- СЕТКА ИГР (ИСПРАВЛЕННАЯ 16:9) --- */
        .page { display: none; }
        .page.active { display: block; }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .game-card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9; /* Ровные прямоугольники */
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.05);
            transition: transform 0.2s, border 0.2s;
        }

        .game-card:active { transform: scale(0.96); }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Идеальное заполнение */
            display: block;
        }

        /* --- КОНТЕНТ --- */
        .content-box {
            background: rgba(10, 14, 22, 0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 16px;
        }

        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }

        /* --- НИЖНЕЕ МЕНЮ --- */
        nav {
            margin-top: auto;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: rgba(4, 6, 10, 0.95);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); font-size: 8px; font-weight: 700; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 18px; }
    </style>
</head>
<body>

    <header>
        <div class="user-block">
            <div class="user-avatar">☣️</div>
            <div>
                <div class="user-name" id="user-name">VIRUS</div>
                <div class="user-role">Игрок</div>
            </div>
        </div>
        <div class="brand-logo">
            <div class="brand-title">VIRUS</div>
            <div class="brand-subtitle">CASINO</div>
        </div>
        <div class="balance-block">
            <div class="balance-val" id="bal">12 500</div>
            <div class="balance-currency">VIR</div>
        </div>
    </header>

    <!-- ГЛАВНАЯ (ЛОББИ) -->
    <div id="page-lobby" class="page active">
        <div class="games-grid">
            <div class="game-card"><img src="https://i.ibb.co/JjLVCZ0w/1786809225235.jpg"></div>
            <div class="game-card"><img src="https://i.ibb.co/8DHFnhZ6/1786809778900.jpg"></div>
            <div class="game-card"><img src="https://i.ibb.co/0j4rs2WB/1786809906957.jpg"></div>
            <div class="game-card"><img src="https://i.ibb.co/NR96zJH/1786810227620.jpg"></div>
            <div class="game-card"><img src="https://i.ibb.co/0jz38B2x/1786812059917.jpg"></div>
            <div class="game-card"><img src="https://i.ibb.co/4ncgxRD2/1786810602933.jpg"></div>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="page-profile" class="page">
        <div class="content-box">
            <div style="text-align:center; margin-bottom:10px; font-weight:800; color:var(--text-gold);">ПРОФИЛЬ</div>
            <div class="info-row"><span>Игрок:</span><b id="prof-name">VIRUS</b></div>
            <div class="info-row"><span>Баланс:</span><b id="prof-bal">12 500 VIR</b></div>
        </div>
    </div>

    <nav>
        <div class="nav-item" onclick="showPage('page-profile', this)">
            <div class="nav-icon">👤</div><span>Профиль</span>
        </div>
        <div class="nav-item" onclick="alert('Настройки пока в разработке')">
            <div class="nav-icon">⚙️</div><span>Настройки</span>
        </div>
        <div class="nav-item" onclick="alert('Топ пуст')">
            <div class="nav-icon">👑</div><span>ТОП</span>
        </div>
        <div class="nav-item" onclick="alert('Поддержка: @support')">
            <div class="nav-icon">❓</div><span>Помощь</span>
        </div>
        <div class="nav-item active" onclick="showPage('page-lobby', this)">
            <div class="nav-icon">🧩</div><span>Ещё</span>
        </div>
    </nav>

    <script>
        // Логика Telegram
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                document.getElementById('user-name').innerText = u.first_name;
                document.getElementById('prof-name').innerText = u.first_name;
            }
        }

        // Переключение страниц
        function showPage(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            if(el) {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                el.classList.add('active');
            }
        }
    </script>
</body>
</html>
