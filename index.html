<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <title>VIRUS CASINO</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        /* =====================================================
           ОСНОВА
        ===================================================== */

        :root {
            --bg: #020305;
            --panel: #080b10;

            --gold: #e9aa27;
            --gold-light: #ffd85a;

            --purple: #8b3cff;
            --blue: #168cff;
            --green: #46d83c;
            --red: #ff3b22;

            --muted: #69717c;
        }


        * {
            box-sizing: border-box;

            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;

            background: #000;
        }


        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(25, 35, 55, .30),
                    transparent 43%
                ),
                #020305;

            overflow-x: hidden;

            padding-top:
                max(8px, env(safe-area-inset-top));

            padding-left: 8px;
            padding-right: 8px;

            padding-bottom:
                calc(
                    82px +
                    env(safe-area-inset-bottom)
                );
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            width: 100%;

            height: 72px;
            min-height: 72px;

            display: grid;

            grid-template-columns:
                1fr auto 1fr;

            align-items: center;

            margin-bottom: 9px;
        }


        /* =====================================================
           USER
        ===================================================== */

        .user-box {
            justify-self: start;

            display: flex;
            align-items: center;

            gap: 7px;

            min-width: 0;

            height: 45px;

            padding:
                4px 9px 4px 4px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20, 24, 31, .97),
                    rgba(5, 7, 11, .97)
                );

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 10px;

            box-shadow:
                0 0 18px rgba(0,0,0,.5),
                inset 0 1px rgba(255,255,255,.03);
        }


        .avatar {
            width: 36px;
            height: 36px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 8px;

            background:
                radial-gradient(
                    circle,
                    #214d24 0%,
                    #0a180d 65%,
                    #050707 100%
                );

            border:
                1px solid
                rgba(255,255,255,.13);

            color: #65e36d;

            font-size: 21px;
            font-weight: 900;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        .user-info {
            min-width: 0;
        }


        .user-name {
            max-width: 82px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: .2px;

            color: #fff;
        }


        /* =====================================================
           ЛОГО
        ===================================================== */

        .logo {
            text-align: center;

            line-height: 1;

            position: relative;
        }


        .logo-title {
            position: relative;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(27px, 7vw, 38px);

            font-weight: 900;

            letter-spacing: 1px;

            background:
                linear-gradient(
                    180deg,
                    #fff0a1 0%,
                    #f7c945 35%,
                    #b36d0a 100%
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

            filter:
                drop-shadow(
                    0 2px 2px rgba(0,0,0,.9)
                )

                drop-shadow(
                    0 0 7px
                    rgba(255,180,30,.18)
                );
        }


        .logo-title::before {
            content: "♛";

            position: absolute;

            left: 50%;
            top: -15px;

            transform:
                translateX(-50%);

            color: #f4c442;

            font-size: 17px;

            filter:
                drop-shadow(
                    0 0 5px
                    rgba(255,190,40,.5)
                );
        }


        .logo-subtitle {
            margin-top: 5px;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 4px;

            color: #a6a9ae;
        }


        /* =====================================================
           БАЛАНС
        ===================================================== */

        .balance-box {
            justify-self: end;

            display: flex;

            align-items: center;

            gap: 6px;

            height: 45px;

            min-width: 104px;

            padding:
                5px 6px;

            background:
                linear-gradient(
                    145deg,
                    rgba(21,17,8,.98),
                    rgba(8,8,7,.98)
                );

            border:
                1px solid
                rgba(212,159,48,.35);

            border-radius: 9px;

            box-shadow:
                0 0 15px
                rgba(170,105,20,.08),

                inset 0 0 10px
                rgba(255,190,40,.025);
        }


        .coin {
            width: 25px;
            height: 25px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffd45d,
                    #bb710d 55%,
                    #6e3905
                );

            border:
                2px solid #d7971c;

            color: #5c3100;

            font-size: 13px;

            font-weight: 900;

            box-shadow:
                0 0 7px
                rgba(255,180,40,.25);
        }


        .balance-info {
            text-align: left;

            line-height: 1.05;

            min-width: 0;
        }


        .balance {
            font-size: 12px;

            font-weight: 900;

            white-space: nowrap;
        }


        .currency {
            margin-top: 3px;

            font-size: 8px;

            font-weight: 800;

            color: #b9a05d;
        }


        .plus {
            width: 25px;
            height: 25px;

            flex-shrink: 0;

            border-radius: 7px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid
                rgba(135,66,255,.65);

            color: #a45cff;

            font-size: 21px;

            font-weight: 300;

            background:
                rgba(80,30,160,.08);

            box-shadow:
                inset 0 0 10px
                rgba(140,50,255,.08);
        }


        /* =====================================================
           СТРАНИЦЫ
        ===================================================== */

        .page {
            display: none;

            animation:
                pageIn .18s ease;
        }


        .page.active {
            display: block;
        }


        @keyframes pageIn {

            from {
                opacity: 0;

                transform:
                    translateY(5px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           ИГРЫ
        ===================================================== */

        .games-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            column-gap: 8px;
            row-gap: 9px;

            padding:
                0 2px;
        }


        .game-card {
            position: relative;

            width: 100%;

            /*
             * Соотношение карточек
             * для вертикального мобильного интерфейса.
             */
            aspect-ratio:
                1.19 / 1;

            overflow: hidden;

            border-radius: 9px;

            background: #05070a;

            border:
                1px solid
                rgba(255,255,255,.14);

            box-shadow:
                0 0 8px
                rgba(0,0,0,.8);

            cursor: pointer;

            transform:
                translateZ(0);

            transition:
                transform .12s ease,
                filter .12s ease;
        }


        .game-card::after {
            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            border-radius: inherit;

            box-shadow:

                inset
                0 0 0 1px
                rgba(255,255,255,.04),

                inset
                0 -25px 35px
                rgba(0,0,0,.12);
        }


        .game-card img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center;

            transform:
                scale(1.001);

            transition:
                transform .15s ease,
                filter .15s ease;
        }


        .game-card:active {
            transform:
                scale(.965);

            filter:
                brightness(.82);
        }


        .game-card:active img {
            transform:
                scale(1.015);
        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .content-box {
            margin:
                5px 2px;

            padding: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(14,18,25,.96),
                    rgba(5,7,11,.96)
                );

            border:
                1px solid
                rgba(255,255,255,.1);

            border-radius: 12px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.45);
        }


        .profile-title {
            text-align: center;

            color: #e9ae32;

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 15px;
        }


        .info-row {
            display: flex;

            justify-content:
                space-between;

            padding: 13px 0;

            border-bottom:
                1px solid
                rgba(255,255,255,.06);

            font-size: 13px;

            color: #7e858f;
        }


        .info-row:last-child {
            border-bottom: 0;
        }


        .info-row b {
            color: white;
        }


        /* =====================================================
           НИЖНЕЕ МЕНЮ
        ===================================================== */

        .bottom-nav {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 100;

            height:
                calc(
                    74px +
                    env(safe-area-inset-bottom)
                );

            padding:
                5px 7px
                env(safe-area-inset-bottom);

            display: flex;

            align-items:
                flex-start;

            justify-content:
                space-around;

            background:
                linear-gradient(
                    180deg,
                    rgba(3,5,8,.88),
                    rgba(1,2,4,.99)
                );

            border-top:
                1px solid
                rgba(255,255,255,.08);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            box-shadow:
                0 -8px 30px
                rgba(0,0,0,.65);
        }


        .nav-item {
            position: relative;

            width: 20%;

            height: 64px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            color: #626a75;

            font-size: 8px;

            font-weight: 700;

            cursor: pointer;

            transition:
                color .15s ease,
                transform .15s ease;
        }


        .nav-item:active {
            transform:
                scale(.92);
        }


        .nav-icon {
            width: 36px;
            height: 36px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: currentColor;
        }


        .nav-icon svg {
            width: 25px;
            height: 25px;

            stroke:
                currentColor;
        }


        .nav-item.active {
            color:
                var(--gold);
        }


        .nav-item.active
        .nav-icon {
            filter:
                drop-shadow(
                    0 0 8px
                    rgba(235,168,30,.35)
                );
        }


        .nav-label {
            text-transform:
                uppercase;

            letter-spacing:
                .2px;
        }


        /* =====================================================
           БОЛЬШИЕ ЭКРАНЫ
        ===================================================== */

        @media (min-width: 600px) {

            body {
                max-width:
                    430px;

                margin:
                    0 auto;
            }

        }


        /* =====================================================
           МАЛЕНЬКИЕ ТЕЛЕФОНЫ
        ===================================================== */

        @media (max-width: 360px) {

            body {
                padding-left: 6px;
                padding-right: 6px;
            }


            .header {
                height: 69px;
                min-height: 69px;
            }


            .user-box {
                height: 43px;

                padding-right: 6px;
            }


            .avatar {
                width: 34px;
                height: 34px;
            }


            .user-name {
                max-width: 58px;
            }


            .balance-box {
                min-width: 94px;

                height: 43px;

                padding: 5px;

                gap: 5px;
            }


            .plus {
                width: 24px;
                height: 24px;
            }


            .games-grid {
                column-gap: 6px;
                row-gap: 7px;

                padding:
                    0 1px;
            }


            .game-card {
                border-radius: 8px;
            }


            .logo-title {
                font-size: 25px;
            }


            .logo-subtitle {
                font-size: 8px;

                letter-spacing: 3px;
            }


            .bottom-nav {
                height:
                    calc(
                        72px +
                        env(safe-area-inset-bottom)
                    );

                padding-left: 4px;
                padding-right: 4px;
            }


            .nav-item {
                height: 62px;
            }


            .nav-icon {
                width: 34px;
                height: 34px;
            }


            .nav-icon svg {
                width: 24px;
                height: 24px;
            }

        }


        /* =====================================================
           ОЧЕНЬ УЗКИЕ ЭКРАНЫ
        ===================================================== */

        @media (max-width: 330px) {

            .user-box {
                gap: 5px;
            }


            .user-name {
                max-width: 48px;
            }


            .balance-box {
                min-width: 88px;
            }


            .coin {
                width: 23px;
                height: 23px;
            }


            .balance {
                font-size: 11px;
            }


            .logo-title {
                font-size: 23px;
            }


            .games-grid {
                column-gap: 5px;
                row-gap: 6px;
            }

        }

    </style>

</head>

    <script>

        const tg =
            window.Telegram?.WebApp;


        /* =====================================================
           TELEGRAM
        ===================================================== */

        if (tg) {

            tg.ready();

            tg.expand();


            try {

                tg.setHeaderColor(
                    "#020305"
                );

                tg.setBackgroundColor(
                    "#020305"
                );

            } catch (error) {

                console.log(
                    "Telegram color error:",
                    error
                );

            }


            const user =
                tg.initDataUnsafe?.user;


            if (user) {

                const name =
                    user.first_name ||
                    user.username ||
                    "VIRUS";


                document
                    .getElementById(
                        "user-name"
                    )
                    .textContent = name;


                document
                    .getElementById(
                        "prof-name"
                    )
                    .textContent = name;


                const avatar =
                    document.getElementById(
                        "user-avatar"
                    );


                if (user.photo_url) {

                    avatar.innerHTML = "";


                    avatar.style.backgroundImage =
                        `url("${user.photo_url}")`;


                    avatar.style.backgroundSize =
                        "cover";


                    avatar.style.backgroundPosition =
                        "center";


                    avatar.style.backgroundRepeat =
                        "no-repeat";

                }

            }

        }


        /* =====================================================
           ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ
        ===================================================== */

        function showPage(
            pageId,
            element
        ) {

            document
                .querySelectorAll(".page")
                .forEach(page => {

                    page.classList.remove(
                        "active"
                    );

                });


            const page =
                document.getElementById(
                    pageId
                );


            if (page) {

                page.classList.add(
                    "active"
                );

            }


            document
                .querySelectorAll(".nav-item")
                .forEach(item => {

                    item.classList.remove(
                        "active"
                    );

                });


            if (element) {

                element.classList.add(
                    "active"
                );

            }


            if (
                tg &&
                tg.HapticFeedback
            ) {

                tg.HapticFeedback
                    .selectionChanged();

            }

        }


        /* =====================================================
           ОТКРЫТИЕ ИГРЫ
        ===================================================== */

        function openGame(game) {

            if (
                tg &&
                tg.HapticFeedback
            ) {

                tg.HapticFeedback
                    .impactOccurred(
                        "light"
                    );

            }


            console.log(
                "Opening game:",
                game
            );

        }


        /* =====================================================
           ПОПОЛНЕНИЕ
        ===================================================== */

        function addBalance() {

            if (
                tg &&
                tg.HapticFeedback
            ) {

                tg.HapticFeedback
                    .impactOccurred(
                        "medium"
                    );

            }


            console.log(
                "Открыть пополнение"
            );

        }

    </script>
