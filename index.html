<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <title>VIRUS CASINO</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        :root {
            --bg: #020305;
            --panel: #080b10;

            --gold: #e9aa27;
            --gold-light: #ffd85a;

            --purple: #8b3cff;
            --muted: #69717c;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;

            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;

            background: #000;
        }


        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(25,35,55,.30),
                    transparent 43%
                ),
                #020305;

            overflow-x: hidden;

            padding-top:
                max(8px, env(safe-area-inset-top));

            padding-left: 8px;
            padding-right: 8px;

            padding-bottom:
                calc(
                    82px +
                    env(safe-area-inset-bottom)
                );
        }


        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            width: 100%;

            height: 72px;
            min-height: 72px;

            display: grid;

            grid-template-columns:
                1fr auto 1fr;

            align-items: center;

            margin-bottom: 9px;
        }


        /* =====================================================
           USER
        ===================================================== */

        .user-box {
            justify-self: start;

            display: flex;
            align-items: center;

            gap: 7px;

            min-width: 0;

            height: 45px;

            padding:
                4px 9px 4px 4px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20,24,31,.97),
                    rgba(5,7,11,.97)
                );

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 10px;

            box-shadow:
                0 0 18px rgba(0,0,0,.5),
                inset 0 1px rgba(255,255,255,.03);
        }


        .avatar {
            width: 36px;
            height: 36px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 8px;

            background:
                radial-gradient(
                    circle,
                    #214d24 0%,
                    #0a180d 65%,
                    #050707 100%
                );

            border:
                1px solid
                rgba(255,255,255,.13);

            color: #65e36d;

            font-size: 21px;
            font-weight: 900;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        .user-info {
            min-width: 0;
        }


        .user-name {
            max-width: 82px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 11px;

            font-weight: 900;

            color: #fff;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {
            text-align: center;

            line-height: 1;

            position: relative;
        }


        .logo-title {
            position: relative;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(27px, 7vw, 38px);

            font-weight: 900;

            letter-spacing: 1px;

            background:
                linear-gradient(
                    180deg,
                    #fff0a1 0%,
                    #f7c945 35%,
                    #b36d0a 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            filter:
                drop-shadow(
                    0 2px 2px rgba(0,0,0,.9)
                )

                drop-shadow(
                    0 0 7px
                    rgba(255,180,30,.18)
                );
        }


        .logo-title::before {
            content: "♛";

            position: absolute;

            left: 50%;
            top: -15px;

            transform:
                translateX(-50%);

            color: #f4c442;

            font-size: 17px;

            filter:
                drop-shadow(
                    0 0 5px
                    rgba(255,190,40,.5)
                );
        }


        .logo-subtitle {
            margin-top: 5px;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 4px;

            color: #a6a9ae;
        }


        /* =====================================================
           BALANCE
        ===================================================== */

        .balance-box {
            justify-self: end;

            display: flex;

            align-items: center;

            gap: 8px;

            height: 45px;

            min-width: 100px;

            padding:
                5px 7px;

            background:
                linear-gradient(
                    145deg,
                    rgba(21,17,8,.98),
                    rgba(8,8,7,.98)
                );

            border:
                1px solid
                rgba(212,159,48,.35);

            border-radius: 9px;

            box-shadow:
                0 0 15px
                rgba(170,105,20,.08),

                inset 0 0 10px
                rgba(255,190,40,.025);

            cursor: pointer;
        }


        /* Монета удалена */


        .balance-info {
            text-align: left;

            line-height: 1.05;

            min-width: 0;
        }


        .balance {
            font-size: 12px;

            font-weight: 900;

            white-space: nowrap;
        }


        .currency {
            margin-top: 3px;

            font-size: 8px;

            font-weight: 800;

            color: #b9a05d;
        }


        .plus {
            width: 25px;
            height: 25px;

            flex-shrink: 0;

            border-radius: 7px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid
                rgba(135,66,255,.65);

            color: #a45cff;

            font-size: 21px;

            background:
                rgba(80,30,160,.08);
        }


        /* =====================================================
           PAGES
        ===================================================== */

        .page {
            display: none;

            animation:
                pageIn .18s ease;
        }


        .page.active {
            display: block;
        }


        @keyframes pageIn {

            from {
                opacity: 0;

                transform:
                    translateY(5px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           GAMES
        ===================================================== */

        .games-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            column-gap: 8px;
            row-gap: 8px;

            padding:
                0 2px;
        }


        .game-card {
            position: relative;

            width: 100%;

            /*
             * Все карточки имеют абсолютно
             * одинаковую геометрию.
             */
            aspect-ratio: 1.16 / 1;

            overflow: hidden;

            border-radius: 9px;

            background: #05070a;

            border:
                1px solid
                rgba(255,255,255,.14);

            box-shadow:
                0 0 8px
                rgba(0,0,0,.8);

            cursor: pointer;

            transform:
                translateZ(0);

            isolation: isolate;

            transition:
                transform .12s ease,
                filter .12s ease;
        }


        .game-card::after {
            content: "";

            position: absolute;

            inset: 0;

            z-index: 2;

            pointer-events: none;

            border-radius: inherit;

            box-shadow:
                inset
                0 0 0 1px
                rgba(255,255,255,.04),

                inset
                0 -25px 35px
                rgba(0,0,0,.12);
        }


        .game-card img {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            /*
             * Все картинки заполняют
             * абсолютно одинаковую область.
             */
            object-fit: cover;

            object-position: center;

            transform:
                scale(1.001);
        }


        .game-card:active {
            transform:
                scale(.965);

            filter:
                brightness(.82);
        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .content-box {
            margin:
                5px 2px;

            padding: 17px;

            background:
                linear-gradient(
                    145deg,
                    rgba(14,18,25,.96),
                    rgba(5,7,11,.96)
                );

            border:
                1px solid
                rgba(255,255,255,.1);

            border-radius: 12px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.45);
        }


        .profile-title {
            text-align: center;

            color: #e9ae32;

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 15px;
        }


        /* =====================================================
           PROFILE ROWS
        ===================================================== */

        .profile-row {
            display: grid;

            grid-template-columns:
                90px 1fr;

            align-items: center;

            gap: 10px;

            min-height: 43px;

            border-bottom:
                1px solid
                rgba(255,255,255,.06);

            font-size: 13px;
        }


        .profile-row:last-of-type {
            border-bottom: 0;
        }


        .profile-label {
            color: #737b86;

            font-weight: 700;
        }


        .profile-value {
            color: #fff;

            font-weight: 800;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .action-button {
            width: 100%;

            min-height: 44px;

            margin-top: 10px;

            border: 1px solid
                rgba(255,255,255,.10);

            border-radius: 9px;

            background:
                linear-gradient(
                    145deg,
                    #121720,
                    #080b10
                );

            color: #fff;

            font-size: 12px;

            font-weight: 900;

            cursor: pointer;

            transition:
                transform .12s ease,
                filter .12s ease,
                border-color .12s ease;
        }


        .action-button:active {
            transform:
                scale(.97);

            filter:
                brightness(.8);
        }


        .promo-button {
            border-color:
                rgba(139,60,255,.45);

            color:
                #c08cff;
        }


        .bonus-button {
            border-color:
                rgba(233,170,39,.40);

            color:
                #f1c45a;
        }


        .support-button {
            border-color:
                rgba(70,216,60,.35);

            color:
                #72e86a;
        }


        /* =====================================================
           TOP
        ===================================================== */

        .leaderboard-status {
            text-align: center;

            padding: 18px 5px;

            color: #69717c;

            font-size: 12px;
        }


        .leaderboard-row {
            display: grid;

            grid-template-columns:
                38px 1fr auto;

            align-items: center;

            gap: 8px;

            min-height: 51px;

            border-bottom:
                1px solid
                rgba(255,255,255,.06);
        }


        .leaderboard-row:last-child {
            border-bottom: 0;
        }


        .leaderboard-place {
            color: #e9aa27;

            font-weight: 900;

            text-align: center;
        }


        .leaderboard-name {
            min-width: 0;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-weight: 800;

            color: #fff;
        }


        .leaderboard-balance {
            color: #e9aa27;

            font-size: 12px;

            font-weight: 900;

            white-space: nowrap;
        }


        /* =====================================================
           SUPPORT
        ===================================================== */

        .support-text {
            text-align: center;

            color: #777f89;

            font-size: 12px;

            line-height: 1.5;

            margin-bottom: 5px;
        }


        /* =====================================================
           BOTTOM NAV
        ===================================================== */

        .bottom-nav {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 100;

            height:
                calc(
                    74px +
                    env(safe-area-inset-bottom)
                );

            padding:
                5px 7px
                env(safe-area-inset-bottom);

            display: flex;

            align-items:
                flex-start;

            justify-content:
                space-around;

            background:
                linear-gradient(
                    180deg,
                    rgba(3,5,8,.88),
                    rgba(1,2,4,.99)
                );

            border-top:
                1px solid
                rgba(255,255,255,.08);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            box-shadow:
                0 -8px 30px
                rgba(0,0,0,.65);
        }


        .nav-item {
            position: relative;

            width: 20%;

            height: 64px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            color: #626a75;

            font-size: 8px;

            font-weight: 700;

            cursor: pointer;

            transition:
                color .15s ease,
                transform .15s ease;
        }


        .nav-item:active {
            transform:
                scale(.92);
        }


        .nav-icon {
            width: 36px;
            height: 36px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: currentColor;
        }


        .nav-icon svg {
            width: 25px;
            height: 25px;

            stroke:
                currentColor;
        }


        .nav-item.active {
            color:
                var(--gold);
        }


        .nav-item.active
        .nav-icon {
            filter:
                drop-shadow(
                    0 0 8px
                    rgba(235,168,30,.35)
                );
        }


        .nav-label {
            text-transform:
                uppercase;

            letter-spacing:
                .2px;
        }


        /* =====================================================
           DESKTOP / 1080x1920
        ===================================================== */

        @media (min-width: 600px) {

            body {
                max-width:
                    430px;

                margin:
                    0 auto;
            }

        }


        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {

            body {
                padding-left: 6px;
                padding-right: 6px;
            }


            .header {
                height: 69px;
                min-height: 69px;
            }


            .user-box {
                height: 43px;

                padding-right: 6px;
            }


            .avatar {
                width: 34px;
                height: 34px;
            }


            .user-name {
                max-width: 58px;
            }


            .balance-box {
                min-width: 94px;

                height: 43px;

                padding: 5px;
            }


            .games-grid {
                column-gap: 6px;
                row-gap: 7px;

                padding:
                    0 1px;
            }


            .game-card {
                aspect-ratio:
                    1.14 / 1;

                border-radius: 8px;
            }


            .logo-title {
                font-size: 25px;
            }


            .logo-subtitle {
                font-size: 8px;

                letter-spacing: 3px;
            }


            .bottom-nav {
                height:
                    calc(
                        72px +
                        env(safe-area-inset-bottom)
                    );

                padding-left: 4px;
                padding-right: 4px;
            }


            .nav-item {
                height: 62px;
            }


            .nav-icon {
                width: 34px;
                height: 34px;
            }


            .nav-icon svg {
                width: 24px;
                height: 24px;
            }


            .profile-row {
                grid-template-columns:
                    80px 1fr;
            }

        }


        /* =====================================================
           VERY SMALL
        ===================================================== */

        @media (max-width: 330px) {

            .user-box {
                gap: 5px;
            }


            .user-name {
                max-width: 48px;
            }


            .balance-box {
                min-width: 88px;
            }


            .balance {
                font-size: 11px;
            }


            .logo-title {
                font-size: 23px;
            }


            .games-grid {
                column-gap: 5px;
                row-gap: 6px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="header">


        <div class="user-box">

            <div
                class="avatar"
                id="user-avatar"
            >
                ☣
            </div>


            <div class="user-info">

                <div
                    class="user-name"
                    id="user-name"
                >
                    NONE
                </div>

            </div>

        </div>


        <div class="logo">

            <div class="logo-title">
                VIRUS
            </div>

            <div class="logo-subtitle">
                CASINO
            </div>

        </div>


        <div
            class="balance-box"
            onclick="addBalance()"
        >

            <div class="balance-info">

                <div
                    class="balance"
                    id="bal"
                >
                    120 000
                </div>


                <div class="currency">
                    VIR
                </div>

            </div>


            <div class="plus">
                +
            </div>

        </div>

    </header>


    <!-- =====================================================
         GAMES
    ===================================================== -->

    <main
        id="page-lobby"
        class="page active"
    >

        <div class="games-grid">


            <div
                class="game-card"
                onclick="openGame('plinko')"
            >

                <img
                    src="https://i.ibb.co/JjLVCZ0w/1786809225235.jpg"
                    alt="Plinko"
                >

            </div>


            <div
                class="game-card"
                onclick="openGame('slots')"
            >

                <img
                    src="https://i.ibb.co/8DHFnhZ6/1786809778900.jpg"
                    alt="Slots"
                >

            </div>


            <div
                class="game-card"
                onclick="openGame('wheel')"
            >

                <img
                    src="https://i.ibb.co/0j4rs2WB/1786809906957.jpg"
                    alt="Wheel"
                >

            </div>


            <div
                class="game-card"
                onclick="openGame('mines')"
            >

                <img
                    src="https://i.ibb.co/NR96zJH/1786810227620.jpg"
                    alt="Mines"
                >

            </div>


            <div
                class="game-card"
                onclick="openGame('coin')"
            >

                <img
                    src="https://i.ibb.co/0jz38B2x/1786812059917.jpg"
                    alt="Coin"
                >

            </div>


            <div
                class="game-card"
                onclick="openGame('crash')"
            >

                <img
                    src="https://i.ibb.co/4ncgxRD2/1786810602933.jpg"
                    alt="Crash"
                >

            </div>

        </div>

    </main>


    <!-- =====================================================
         SETTINGS
    ===================================================== -->

    <section
        id="page-settings"
        class="page"
    >

        <div class="content-box">

            <div class="profile-title">
                НАСТРОЙКИ
            </div>


            <div class="info-row">

                <span>
                    Звуки
                </span>

                <b>
                    ВКЛ
                </b>

            </div>


            <div class="info-row">

                <span>
                    Вибрация
                </span>

                <b>
                    ВКЛ
                </b>

            </div>

        </div>

    </section>


    <!-- =====================================================
         TOP
    ===================================================== -->

    <section
        id="page-top"
        class="page"
    >

        <div class="content-box">

            <div class="profile-title">
                ТОП ИГРОКОВ
            </div>


            <div
                id="leaderboard"
            >

                <div class="leaderboard-status">
                    Загрузка игроков...
                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         HELP
    ===================================================== -->

    <section
        id="page-help"
        class="page"
    >

        <div class="content-box">

            <div class="profile-title">
                ПОМОЩЬ
            </div>


            <div class="support-text">
                Если у тебя возникли вопросы
                или проблемы — напиши в поддержку.
            </div>


            <button
                class="action-button support-button"
                onclick="openSupport()"
            >
                Написать поддержку
            </button>

        </div>

    </section>


    <!-- =====================================================
         PROFILE
    ===================================================== -->

    <section
        id="page-profile"
        class="page"
    >

        <div class="content-box">

            <div class="profile-title">
                ПРОФИЛЬ
            </div>


            <div class="profile-row">

                <span class="profile-label">
                    Имя
                </span>

                <b
                    class="profile-value"
                    id="prof-name"
                >
                    NONE
                </b>

            </div>


            <div class="profile-row">

                <span class="profile-label">
                    Айди
                </span>

                <b
                    class="profile-value"
                    id="prof-id"
                >
                    NONE
                </b>

            </div>


            <div class="profile-row">

                <span class="profile-label">
                    Юзернейм
                </span>

                <b
                    class="profile-value"
                    id="prof-username"
                >
                    NONE
                </b>

            </div>


            <div class="profile-row">

                <span class="profile-label">
                    Баланс
                </span>

                <b
                    class="profile-value"
                    id="prof-bal"
                >
                    120 000 VIR
                </b>

            </div>


            <button
                class="action-button promo-button"
                onclick="activatePromo()"
            >
                Активировать промокод
            </button>


            <button
                class="action-button bonus-button"
                onclick="dailyBonus()"
            >
                Ежедневный бонус
            </button>

        </div>

    </section>


    <!-- =====================================================
         BOTTOM NAV
         ИГРЫ / НАСТРОЙКИ / ТОП / ПОМОЩЬ / ПРОФИЛЬ
    ===================================================== -->

    <nav class="bottom-nav">


        <!-- ИГРЫ -->

        <div
            class="nav-item active"
            onclick="
                showPage(
                    'page-lobby',
                    this
                )
            "
        >

            <div class="nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke-width="1.7"
                >

                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="16"
                        rx="3"
                    />

                    <path
                        d="M8 10v5" />

                    <path
                        d="M5.5 12.5h5" />

                    <circle
                        cx="16"
                        cy="11"
                        r="1"
                    />

                    <circle
                        cx="18"
                        cy="14"
                        r="1"
                    />

                </svg>

            </div>


            <span class="nav-label">
                Игры
            </span>

        </div>


        <!-- НАСТРОЙКИ -->

        <div
            class="nav-item"
            onclick="
                showPage(
                    'page-settings',
                    this
                )
            "
        >

            <div class="nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke-width="1.7"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="3"

    <script>

        /* =====================================================
           TELEGRAM
        ===================================================== */

        const tg =
            window.Telegram?.WebApp;


        /*
         * Единый баланс.
         *
         * Пока здесь 120000.
         * В дальнейшем его лучше получать
         * с сервера через /api/auth.
         */

        let balance = 120000;


        /*
         * Данные Telegram пользователя.
         */

        let telegramUser = null;


        /* =====================================================
           ФОРМАТ БАЛАНСА
        ===================================================== */

        function formatBalance(value) {

            value = Number(value) || 0;


            /*
             * Миллионы:
             *
             * 1 000 000 -> 1кк
             * 7 340 000 -> 7.34кк
             */

            if (value >= 1000000) {

                let millions =
                    value / 1000000;


                let result =
                    millions
                        .toFixed(2)
                        .replace(
                            /\.00$/,
                            ""
                        )
                        .replace(
                            /(\.\d)0$/,
                            "$1"
                        );


                return result + "кк";
            }


            /*
             * Обычные числа:
             *
             * 120000 -> 120 000
             */

            return Math.floor(value)
                .toLocaleString(
                    "ru-RU"
                )
                .replace(
                    /\u00A0/g,
                    " "
                );
        }


        function updateBalanceUI() {

            const formatted =
                formatBalance(balance);


            const balanceElement =
                document.getElementById(
                    "bal"
                );


            const profileBalance =
                document.getElementById(
                    "prof-bal"
                );


            if (balanceElement) {

                balanceElement.textContent =
                    formatted;
            }


            if (profileBalance) {

                profileBalance.textContent =
                    formatted + " VIR";
            }

        }


        /* =====================================================
           TELEGRAM USER
        ===================================================== */

        function setNoneUser() {

            telegramUser = null;


            document
                .getElementById("user-name")
                .textContent = "NONE";


            document
                .getElementById("prof-name")
                .textContent = "NONE";


            document
                .getElementById("prof-id")
                .textContent = "NONE";


            document
                .getElementById("prof-username")
                .textContent = "NONE";


            const avatar =
                document.getElementById(
                    "user-avatar"
                );


            avatar.innerHTML = "☣";

            avatar.style.backgroundImage =
                "none";

        }


        function setTelegramUser(user) {

            if (!user) {

                setNoneUser();

                return;
            }


            telegramUser = user;


            const name =
                user.first_name ||
                user.username ||
                "NONE";


            document
                .getElementById("user-name")
                .textContent = name;


            document
                .getElementById("prof-name")
                .textContent = name;


            document
                .getElementById("prof-id")
                .textContent =
                    user.id ??
                    "NONE";


            document
                .getElementById("prof-username")
                .textContent =
                    user.username
                        ? "@" + user.username
                        : "NONE";


            const avatar =
                document.getElementById(
                    "user-avatar"
                );


            if (user.photo_url) {

                avatar.innerHTML = "";


                avatar.style.backgroundImage =
                    `url("${user.photo_url}")`;

            }

        }


        /* =====================================================
           TELEGRAM INIT
        ===================================================== */

        if (tg) {

            tg.ready();

            tg.expand();


            try {

                tg.setHeaderColor(
                    "#020305"
                );

                tg.setBackgroundColor(
                    "#020305"
                );

            } catch (error) {

                console.log(
                    "Telegram color error:",
                    error
                );

            }


            const user =
                tg.initDataUnsafe?.user;


            if (user) {

                setTelegramUser(user);

            } else {

                setNoneUser();

            }

        } else {

            /*
             * Открыли обычную страницу
             * через Chrome / браузер.
             */

            setNoneUser();

        }


        /* =====================================================
           АВТОРИЗАЦИЯ НА СЕРВЕРЕ
        ===================================================== */

        if (
            tg &&
            tg.initData
        ) {

            fetch(
                "/api/auth",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        initData:
                            tg.initData
                    })
                }
            )

            .then(res =>
                res.json()
            )

            .then(data => {

                if (!data.ok) {

                    console.log(
                        "Авторизация не подтверждена"
                    );

                    return;
                }


                /*
                 * Если сервер вернул
                 * пользователя.
                 */

                if (data.user) {

                    setTelegramUser(
                        data.user
                    );

                }


                /*
                 * Если сервер вернул баланс,
                 * используем именно его.
                 */

                if (
                    typeof data.balance ===
                    "number"
                ) {

                    balance =
                        data.balance;

                    updateBalanceUI();

                }


                console.log(
                    "Telegram user:",
                    data.user
                );

            })

            .catch(error => {

                console.log(
                    "Auth error:",
                    error
                );

            });

        }


        /* =====================================================
           ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ
        ===================================================== */

        function showPage(
            pageId,
            element
        ) {

            document
                .querySelectorAll(".page")
                .forEach(page => {

                    page.classList.remove(
                        "active"
                    );

                });


            const page =
                document.getElementById(
                    pageId
                );


            if (page) {

                page.classList.add(
                    "active"
                );

            }


            document
                .querySelectorAll(".nav-item")
                .forEach(item => {

                    item.classList.remove(
                        "active"
                    );

                });


            if (element) {

                element.classList.add(
                    "active"
                );

            }


            if (
                tg &&
                tg.HapticFeedback
            ) {

                tg.HapticFeedback
                    .selectionChanged();

            }


            /*
             * При открытии ТОПа
             * обновляем список игроков.
             */

            if (
                pageId === "page-top"
            ) {

                loadLeaderboard();

            }

        }


        /* =====================================================
           ОТКРЫТИЕ ИГРЫ
        ===================================================== */

        function openGame(game) {

            if (
                tg &&
                tg.HapticFeedback
            ) {

                tg.HapticFeedback
                    .impactOccurred(
                        "light"
                    );

            }


            console.log(
                "Opening game:",
                game
            );

        }


        /* =====================================================
           ПОПОЛНЕНИЕ
        ===================================================== */

        function addBalance() {

            if (
                tg &&
                tg.HapticFeedback
            ) {

                tg.HapticFeedback
                    .impactOccurred(
                        "medium"
                    );

            }


            console.log(
                "Открыть пополнение"
            );

        }


        /* =====================================================
           ПОДДЕРЖКА
        ===================================================== */

        function openSupport() {

            const url =
                "https://t.me/VirusRip";


            if (tg) {

                try {

                    tg.openTelegramLink(
                        url
                    );

                    return;

                } catch (error) {

                    console.log(
                        "Telegram link error:",
                        error
                    );

                }

            }


            window.open(
                url,
                "_blank"
            );

        }


        /* =====================================================
           ПРОМОКОД
        ===================================================== */

        function activatePromo() {

            if (
                tg &&
                tg.HapticFeedback
            ) {

                tg.HapticFeedback
                    .impactOccurred(
                        "light"
                    );

            }


            const code =
                prompt(
                    "Введите промокод:"
                );


            if (!code) {

                return;
            }


            console.log(
                "Promo code:",
                code
            );

        }


        /* =====================================================
           ЕЖЕДНЕВНЫЙ БОНУС
        ===================================================== */

        function dailyBonus() {

            if (
                tg &&
                tg.HapticFeedback
            ) {

                tg.HapticFeedback
                    .impactOccurred(
                        "medium"
                    );

            }


            console.log(
                "Ежедневный бонус"
            );

        }


        /* =====================================================
           TOP / LEADERBOARD
        ===================================================== */

        async function loadLeaderboard() {

            const container =
                document.getElementById(
                    "leaderboard"
                );


            if (!container) {

                return;
            }


            container.innerHTML = `
                <div class="leaderboard-status">
                    Загрузка игроков...
                </div>
            `;


            try {

                const response =
                    await fetch(
                        "/api/leaderboard",
                        {
                            method: "GET",
                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Leaderboard HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                /*
                 * Ожидается:
                 *
                 * {
                 *   "ok": true,
                 *   "players": [
                 *      {
                 *        "id": 123,
                 *        "first_name": "Name",
                 *        "username": "username",
                 *        "balance": 500000
                 *      }
                 *   ]
                 * }
                 */


                if (
                    !data.ok ||
                    !Array.isArray(
                        data.players
                    )
                ) {

                    throw new Error(
                        "Неверный формат ТОПа"
                    );

                }


                if (
                    data.players.length === 0
                ) {

                    container.innerHTML = `
                        <div class="leaderboard-status">
                            Пока нет игроков в ТОПе.
                        </div>
                    `;

                    return;
                }


                container.innerHTML =
                    data.players
                        .slice(0, 20)
                        .map(
                            (player, index) => {

                                const playerName =
                                    player.first_name ||
                                    (
                                        player.username
                                            ? "@" +
                                              player.username
                                            : "NONE"
                                    );


                                const playerBalance =
                                    formatBalance(
                                        player.balance
                                    );


                                return `
                                    <div
                                        class="leaderboard-row"
                                    >

                                        <div
                                            class="leaderboard-place"
                                        >
                                            ${index + 1}
                                        </div>


                                        <div
                                            class="leaderboard-name"
                                        >
                                            ${escapeHtml(
                                                playerName
                                            )}
                                        </div>


                                        <div
                                            class="leaderboard-balance"
                                        >
                                            ${playerBalance}
                                            VIR
                                        </div>

                                    </div>
                                `;

                            }
                        )
                        .join("");

            }

            catch (error) {

                console.log(
                    "Leaderboard error:",
                    error
                );


                container.innerHTML = `
                    <div class="leaderboard-status">
                        Не удалось загрузить ТОП игроков.
                    </div>
                `;

            }

        }


        /* =====================================================
           БЕЗОПАСНЫЙ ТЕКСТ
        ===================================================== */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           START
        ===================================================== */

        updateBalanceUI();

    </script>
